name: Build MediaVerkenner Windows
on:
  workflow_dispatch:
  push:
    branches:
      - windows/fotoverkenner-desktop-v1
    paths:
      - "windows/**"
      - ".github/workflows/windows-fotoverkenner.yml"
permissions:
  contents: read
jobs:
  create-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render Android-matching app icon
        run: |
          python -m pip install --upgrade pip
          pip install cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image
          cairosvg.svg2png(url="windows/mediaverkenner-icon.svg", write_to="mediaverkenner.png", output_width=512, output_height=512)
          Image.open("mediaverkenner.png").save("mediaverkenner.ico", format="ICO", sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mediaverkenner-app-icon
          path: mediaverkenner.ico
          retention-days: 1
  build:
    needs: create-icon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mediaverkenner-app-icon
          path: windows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all comtypes --name MediaVerkenner --icon windows/mediaverkenner.ico --add-data "windows/mediaverkenner.ico;." windows/fotoverkenner.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MediaVerkenner-Windows-x64
          path: dist/MediaVerkenner.exe
          if-no-files-found: error
          retention-days: 14
