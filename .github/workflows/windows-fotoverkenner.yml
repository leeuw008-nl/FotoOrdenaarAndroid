name: Build MediaVerkenner Windows
on:
  workflow_dispatch:
  push:
    branches:
      - windows/mediaverkenner-desktop-v1
    paths:
      - "windows/**"
      - ".github/workflows/windows-mediaverkenner.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MediaVerkenner windows/mediaverkenner.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MediaVerkenner-Windows-x64
          path: dist/MediaVerkenner.exe
          if-no-files-found: error
          retention-days: 14
