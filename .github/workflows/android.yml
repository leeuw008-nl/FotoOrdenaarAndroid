name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/gps-xmp-diagnostics
      - restore/fotoverkenner-backup-test-2026-10-29
      - test/fotoverkenner-video-vanaf-werkende-gps-2026-10-29
      - test/mediaverkenner-video-gps-metadata-2026-10-29
      - test/mediaverkenner-quicktime-metadata-2026-10-29
      - test/mediaverkenner-echte-mediainfo-2026-10-29
      - fix/mediaverkenner-videometadata-crash-2026-10-29
      - fix/mediaverkenner-gps-regex-2026-10-29
      - fix/mediaverkenner-gps-decimale-graden-2026-10-29
      - fix/mediaverkenner-mp4-reader-2026-10-29
      - test/mediaverkenner-diagnose-metadata-2026-10-29
      - fix/mediaverkenner-diagnose-zonder-native-crash-2026-10-29
      - fix/mediaverkenner-metadata-scroll-kopieer-2026-10-29
      - fix/mediaverkenner-mediamap-wisselen-2026-10-29
      - test/mediaverkenner-mp4-gps-audio-2026-10-29
      - fix/mediaverkenner-metadata-niet-blokkeren-2026-10-29
      - fix/mediaverkenner-video-original-gps-2026-10-29
      - fix/mediaverkenner-groene-tabs-2026-10-29
      - fix/mediaverkenner-groene-fototabs-2026-10-29
      - fix/mediaverkenner-volledig-pad-header-2026-10-29
      - fix/mediaverkenner-kaartzoom-header-2026-10-29
      - fix/mediaverkenner-kaartbediening-header-v2-2026-10-29
      - fix/mediaverkenner-kaart-leaflet-header-v3-2026-10-29
      - integratie/MediaOrdenaar-compleet-2026-10-29

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Apply Android activity compatibility fix
        run: |
          sed -i 's/import android.app.Activity/import androidx.activity.ComponentActivity/' app/src/main/java/nl/fotoordenaar/MainActivity.kt
          sed -i 's/class MainActivity : Activity()/class MainActivity : ComponentActivity()/' app/src/main/java/nl/fotoordenaar/MainActivity.kt

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FotoOrdenaar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
