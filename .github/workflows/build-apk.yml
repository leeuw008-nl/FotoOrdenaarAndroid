
name: Build FotoOrdenaar integratietest APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - foto-verkenner-standalone
      - test/fotoordenaar-met-verkenner

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Apply Android activity compatibility fix
        run: |
          sed -i 's/import android.app.Activity/import androidx.activity.ComponentActivity/' app/src/main/java/nl/fotoordenaar/MainActivity.kt
          sed -i 's/class MainActivity : Activity()/class MainActivity : ComponentActivity()/' app/src/main/java/nl/fotoordenaar/MainActivity.kt

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FotoOrdenaar-integratietest-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publiceer APK als GitHub Release
        if: github.ref == 'refs/heads/foto-verkenner-standalone' || github.ref == 'refs/heads/test/fotoordenaar-met-verkenner'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="foto-integratietest-${GITHUB_SHA:0:8}"
          cp app/build/outputs/apk/debug/app-debug.apk FotoOrdenaar-integratietest.apk
          gh release create "$TAG" FotoOrdenaar-integratietest.apk --title "FotoOrdenaar integratietest ${GITHUB_SHA:0:8}" --notes "APK voor Foto-verkenner, rechtstreeks te downloaden zonder Actions-artifact." --target "$GITHUB_SHA"
