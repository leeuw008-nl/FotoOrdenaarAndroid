name: Build FotoOrdenaar APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Inspect GPS metadata in sample photo
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl
          echo "=== GPS/XMP metadata in 20261022_164831.jpg ==="
          exiftool -a -G1 -s 20261022_164831.jpg | grep -Ei 'GPS|XMP|Location|Position|Latitude|Longitude' || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Apply Android activity compatibility fix
        run: |
          sed -i 's/import android.app.Activity/import androidx.activity.ComponentActivity/' app/src/main/java/nl/fotoordenaar/MainActivity.kt
          sed -i 's/class MainActivity : Activity()/class MainActivity : ComponentActivity()/' app/src/main/java/nl/fotoordenaar/MainActivity.kt

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FotoOrdenaar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
